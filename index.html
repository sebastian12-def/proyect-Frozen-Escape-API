<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Frozen Escape</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    margin: 0;
}

/* HEADER */
h1 {
    text-align: center;
    padding: 15px;
}

/* GRID PRINCIPAL */
.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
    margin: auto;
}

/* TARJETAS */
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* FULL WIDTH */
.full {
    grid-column: span 2;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
}

/* BOTONES */
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #38bdf8;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0ea5e9;
}

/* BARRAS DE ESTADO */
.bar {
    height: 20px;
    border-radius: 5px;
    margin-top: 5px;
}

.temp {
    background: red;
}

.energy {
    background: green;
}

/* JSON */
pre {
    background: #020617;
    padding: 10px;
    border-radius: 6px;
}
</style>

</head>

<body>

<h1>Frozen Escape</h1>

<div class="container">

    <!-- REGISTRO -->
    <div class="card">
        <h3>Registro</h3>
        <input id="regUser" placeholder="Usuario">
        <input id="regPass" type="password" placeholder="Contraseña">
        <button onclick="register()">Crear cuenta</button>
    </div>

    <!-- LOGIN -->
    <div class="card">
        <h3>Login</h3>
        <input id="logUser" placeholder="Usuario">
        <input id="logPass" type="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </div>

    <!-- ESTADO -->
    <div class="card">
        <h3>Estado del jugador</h3>
        <button onclick="getEstado()">Actualizar estado</button>
        <pre id="estado"></pre>
    </div>

    <!-- ACCIONES -->
    <div class="card">
        <h3>Acciones</h3>
        <div class="actions">
            <button onclick="accion(1)">Buscar refugio</button>
            <button onclick="accion(2)">Comer</button>
            <button onclick="accion(3)">Explorar</button>
        </div>
    </div>

    <!-- RANKING -->
    <div class="card">
        <h3>Ranking</h3>
        <button onclick="getRanking()">Ver ranking</button>
        <pre id="ranking"></pre>
    </div>

</div>

<script>
const API = "http://127.0.0.1:8000/api/";

// REGISTRO
async function register() {
    let username = document.getElementById("regUser").value;
    let password = document.getElementById("regPass").value;

    let res = await fetch(API + "usuarios/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    alert("Usuario creado");
}

// LOGIN
async function login() {
    let username = document.getElementById("logUser").value;
    let password = document.getElementById("logPass").value;

    let res = await fetch(API + "token/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    let data = await res.json();

    if (data.access) {
        localStorage.setItem("token", data.access);
        alert("Login exitoso");
    } else {
        alert("Error en login");
    }
}

// TOKEN
function getToken() {
    return localStorage.getItem("token");
}

// ESTADO
async function getEstado() {
    let token = getToken();

    let res = await fetch(API + "estado/", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    let data = await res.json();
    document.getElementById("estado").innerText = JSON.stringify(data, null, 2);
}

// ACCIÓN
async function accion(id) {
    let token = getToken();

    let res = await fetch(API + "accion/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({accion_id: id})
    });

    let data = await res.json();
    alert("Acción ejecutada");
}

// RANKING
async function getRanking() {
    let res = await fetch(API + "ranking/");
    let data = await res.json();

    document.getElementById("ranking").innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
